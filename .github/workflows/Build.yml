name: Build LWJGL 3.4.3 for iOS (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout LWJGL 3.4.3
        uses: actions/checkout@v4
        with:
          repository: LWJGL/lwjgl3
          ref: '3.4.3'
          path: lwjgl3

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install ant
        run: brew install ant

      - name: Inspect (build config and libffi layout)
        working-directory: lwjgl3
        run: |
          find . -name "ffitarget.h" | head
          ls config/macos || true
          grep -n "mmacosx\|arch\|isysroot\|framework" config/macos/build.xml | head -60 || true

      # clang/gcc/cc をラッパーに差し替え、iOS用フラグを強制する
      - name: Create iOS clang wrapper
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          REAL_CLANG=$(xcrun --sdk iphoneos -f clang)
          mkdir -p $HOME/ioswrap
          cat > $HOME/ioswrap/clang << EOF
          #!/bin/bash
          args=()
          skip=0
          for a in "\$@"; do
            if [ \$skip -eq 1 ]; then skip=0; continue; fi
            case "\$a" in
              -mmacosx-version-min=*) ;;
              -arch) skip=1 ;;
              -isysroot) skip=1 ;;
              *) args+=("\$a") ;;
            esac
          done
          exec "$REAL_CLANG" -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=15.0 "\${args[@]}"
          EOF
          chmod +x $HOME/ioswrap/clang
          ln -sf $HOME/ioswrap/clang $HOME/ioswrap/gcc
          ln -sf $HOME/ioswrap/clang $HOME/ioswrap/cc
          echo "$HOME/ioswrap" >> $GITHUB_PATH

      - name: Build templates and Java classes
        working-directory: lwjgl3
        run: |
          ant -Dbinding.skip=true init || ant init
          ant compile-templates
          ant compile

      - name: Build native (iOS arm64)
        working-directory: lwjgl3
        continue-on-error: true
        run: |
          # libffi の ffitarget.h をインクルードパスに通す
          FFI_T=$(find modules/lwjgl/core -name "ffitarget.h" | grep -i "aarch64\|arm64" | head -1)
          if [ -n "$FFI_T" ]; then
            export CPATH="$(dirname $FFI_T):$CPATH"
          fi
          export CPATH="$PWD/modules/lwjgl/core/src/main/c/libffi:$CPATH"
          ant -Dplatform=macos -Dos.arch=arm64 compile-native 2>&1 | tee ../native-build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          find lwjgl3/bin -name "*.dylib" -exec cp {} out/ \; || true
          cp native-build.log out/ || true
          for f in out/*.dylib; do [ -f "$f" ] && (file "$f"; otool -l "$f" | grep -A4 LC_BUILD_VERSION) ; done || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-3.4.3-ios
          path: out/
