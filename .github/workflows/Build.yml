name: Build LWJGL 3.4.3 for iOS (arm64)

on:
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build-ios-dylib:
    runs-on: macos-15 # Apple Silicon (arm64) + Xcode 搭載環境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (for LWJGL build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build dependencies (Ant, CMake, Ninja)
        run: |
          brew install ant cmake ninja

      - name: Clone LWJGL 3.4.3 source
        run: |
          git clone --branch 3.4.3 --depth 1 https://github.com
          cd lwjgl3
          ant init

      - name: Configure iOS SDK & Cross-Compile Flags
        run: |
          cd lwjgl3
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "IOS_SDK=$IOS_SDK" >> $GITHUB_ENV

          # macOS向けビルド設定をiOS (arm64-apple-ios) 向けに書き換え
          cat << 'EOF' > ios_toolchain.cmake
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_OSX_ARCHITECTURES "arm64")
          set(CMAKE_OSX_DEPLOYMENT_TARGET "15.0")
          set(CMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH NO)
          set(CMAKE_IOS_INSTALL_COMBINED NO)
          EOF

      - name: Build LWJGL Core & Native Dylibs for iOS
        run: |
          cd lwjgl3
          # Java側のコード生成とコンパイル
          ant compile-templates
          ant compile

          # ネイティブC/C++部分をiOS SDK (arm64) 向けにコンパイル
          mkdir -p bin/ios/arm64
          IOS_FLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=15.0 -O3 -fPIC -shared"

          # コアライブラリ (liblwjgl.dylib) のビルド
          clang $IOS_FLAGS \
            -Imodules/lwjgl/core/src/main/c \
            -Imodules/lwjgl/core/src/main/c/macos \
            -Imodules/lwjgl/core/src/generated/c \
            -I$JAVA_HOME/include \
            -I$JAVA_HOME/include/darwin \
            modules/lwjgl/core/src/main/c/*.c \
            modules/lwjgl/core/src/main/c/macos/*.c \
            modules/lwjgl/core/src/generated/c/*.c \
            -framework Foundation -framework CoreFoundation \
            -o bin/ios/arm64/liblwjgl.dylib

          # ビルドされたバイナリのアーキテクチャ確認
          file bin/ios/arm64/liblwjgl.dylib
          otool -l bin/ios/arm64/liblwjgl.dylib | grep -A 4 LC_BUILD_VERSION

      - name: Upload iOS dylib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-3.4.3-ios-arm64-dylibs
          path: lwjgl3/bin/ios/arm64/*.dylib
