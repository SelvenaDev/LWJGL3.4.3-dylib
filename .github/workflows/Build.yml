name: Build LWJGL 3.4.3 for iOS (arm64) v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout LWJGL 3.4.3
        uses: actions/checkout@v4
        with:
          repository: LWJGL/lwjgl3
          ref: '3.4.3'
          path: lwjgl3

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install ant
        run: brew install ant

      # clang / clang++ の両方をラッパーにして、コンパイルもリンクもiOS向けに固定する
      - name: Create iOS compiler wrappers
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p $HOME/ioswrap
          for tool in clang clang++; do
            REAL=$(xcrun --sdk iphoneos -f $tool)
            cat > $HOME/ioswrap/$tool << EOF
          #!/bin/bash
          args=()
          skip=0
          for a in "\$@"; do
            if [ \$skip -eq 1 ]; then skip=0; continue; fi
            case "\$a" in
              -mmacosx-version-min=*) ;;
              -arch) skip=1 ;;
              -isysroot) skip=1 ;;
              *) args+=("\$a") ;;
            esac
          done
          exec "$REAL" -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=15.0 "\${args[@]}"
          EOF
            chmod +x $HOME/ioswrap/$tool
          done
          ln -sf $HOME/ioswrap/clang   $HOME/ioswrap/gcc
          ln -sf $HOME/ioswrap/clang   $HOME/ioswrap/cc
          ln -sf $HOME/ioswrap/clang++ $HOME/ioswrap/g++
          ln -sf $HOME/ioswrap/clang++ $HOME/ioswrap/c++
          echo "$HOME/ioswrap" >> $GITHUB_PATH

      # iOS SDKに無い <objc/objc-runtime.h> を補う(coreのObjCRuntime.cが要求)
      - name: Create objc-runtime.h shim
        run: |
          mkdir -p $HOME/iosshim/objc
          cat > $HOME/iosshim/objc/objc-runtime.h << 'EOF'
          #pragma once
          #include <objc/objc.h>
          #include <objc/runtime.h>
          #include <objc/message.h>
          EOF
          echo "CPATH=$HOME/iosshim:$GITHUB_WORKSPACE/lwjgl3/modules/lwjgl/core/src/main/c/libffi" >> $GITHUB_ENV

      - name: Build templates and Java classes
        working-directory: lwjgl3
        run: |
          ant init
          ant compile-templates
          ant compile

      # LWJGLのコアは build.lwjgl.org から macOS用 libffi.a を落としてリンクするため、iOSでは使えない。
      # iOS用libffi.aを自前で作り、オフラインモードで差し込む。
      - name: Build libffi.a for iOS arm64
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          unset CPATH
          curl -sL https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz | tar xz
          cd libffi-3.4.6
          ./configure --host=aarch64-apple-darwin --disable-shared --enable-static \
            --disable-docs --disable-multi-os-directory \
            CC="$(xcrun --sdk iphoneos -f clang)" \
            CFLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=15.0 -O2 -fPIC" \
            LDFLAGS="-arch arm64 -isysroot $IOS_SDK"
          make -j4
          find . -name "libffi.a" | head
          D=$GITHUB_WORKSPACE/lwjgl3/bin/libs/native/macos/arm64/org/lwjgl
          mkdir -p $D
          cp "$(find . -name libffi.a | head -1)" $D/libffi.a
          lipo -info $D/libffi.a
          vtool -show-build $D/libffi.a | head -20 || true

      - name: Build native (iOS arm64)
        working-directory: lwjgl3
        continue-on-error: true
        run: |
          # coreの -Werror -pedantic がiOS SDKで警告→エラーになるのを避ける
          sed -i 's/-Werror -Wfatal-errors/-Wno-error/g' config/macos/build.xml
          export LWJGL_BUILD_OFFLINE=true
          ant -Dplatform=macos -Dos.arch=arm64 compile-native 2>&1 | tee ../native-build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          find lwjgl3/bin/libs -name "*.dylib" -exec cp {} out/ \; || true
          cp lwjgl3/bin/libs/native/macos/arm64/org/lwjgl/libffi.a out/ || true
          cp native-build.log out/ || true
          # プラットフォーム確認 (iOS = platform 2)
          for f in out/*.dylib; do
            echo "== $f"; vtool -show-build "$f" 2>/dev/null | grep -E "platform|minos" || true
          done
          ls -la out

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-3.4.3-ios
          path: out/
